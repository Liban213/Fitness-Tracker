{% extends "base.html" %}
{% block title %}New workout · Repwise{% endblock %}

{% block content %}
<div class="card">
    <h1>New workout</h1>
    <form method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. Push day" autofocus>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ date or '' }}">

        <button type="submit">Create workout</button>
    </form>
    <p class="muted"><a href="{{ url_for('dashboard') }}">← Back to dashboard</a></p>
</div>
{% endblock %}
