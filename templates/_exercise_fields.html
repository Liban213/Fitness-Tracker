{# Shared by the "add exercise" and "edit exercise" forms. Expects `form`. #}
<label for="name">Exercise</label>
<input type="text" id="name" name="name" value="{{ form.name or '' }}" placeholder="e.g. Bench press">

<div class="row">
    <div>
        <label for="sets">Sets</label>
        <input type="number" id="sets" name="sets" min="1" value="{{ form.sets or '' }}">
    </div>
    <div>
        <label for="reps">Reps</label>
        <input type="number" id="reps" name="reps" min="1" value="{{ form.reps or '' }}">
    </div>
    <div>
        <label for="weight">Weight (kg, optional)</label>
        <input type="number" id="weight" name="weight" min="0" step="0.5" value="{{ form.weight | weight }}">
    </div>
</div>
