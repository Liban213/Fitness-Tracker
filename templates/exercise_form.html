{% extends "base.html" %}
{% block title %}Edit exercise · Repwise{% endblock %}

{% block content %}
<div class="card">
    <h1>Edit exercise</h1>
    <form method="post">
        {% include "_exercise_fields.html" %}
        <button type="submit">Save changes</button>
    </form>
    <p class="muted"><a href="{{ url_for('view_workout', workout_id=exercise.workout_id) }}">← Back to workout</a></p>
</div>
{% endblock %}
